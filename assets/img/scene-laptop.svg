  <rect x="256" y="168" width="294" height="176" rx="9" fill="url(#scr)"/>
  <rect x="272" y="184" width="150" height="12" rx="6" fill="#1d4ed8" opacity=".75"/>
  <rect x="272" y="206" width="104" height="8" rx="4" fill="#334155" opacity=".45"/>
  <g fill="#12a35d">
    <rect x="278" y="300" width="22" height="26" rx="4"/><rect x="308" y="286" width="22" height="40" rx="4"/>
    <rect x="338" y="266" width="22" height="60" rx="4"/><rect x="368" y="246" width="22" height="80" rx="4"/>
