  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="672" cy="86" r="158" fill="#ffffff" opacity=".10"/>
  <circle cx="120" cy="430" r="120" fill="#ffffff" opacity=".07"/>
  <rect y="356" width="800" height="144" fill="url(#wood)"/>
  <rect y="356" width="800" height="10" fill="#ffffff" opacity=".18"/>
