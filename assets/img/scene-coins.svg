<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Stacks of coins with a growing plant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04361f"/><stop offset=".5" stop-color="#0b6b3f"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7a0"/><stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="640" cy="120" r="150" fill="#ffffff" opacity=".08"/>
  <g opacity=".16" fill="#ffffff">
    <circle cx="90" cy="90" r="5"/><circle cx="140" cy="140" r="4"/><circle cx="60" cy="180" r="6"/>
  </g>
  <!-- stacks -->
  <g>
    <g fill="url(#coin)">
      <ellipse cx="470" cy="424" rx="92" ry="24"/><rect x="378" y="400" width="184" height="24" fill="#c2830c"/>
      <ellipse cx="470" cy="400" rx="92" ry="24"/>
      <rect x="378" y="352" width="184" height="48" fill="url(#coin)"/>
      <ellipse cx="470" cy="352" rx="92" ry="24"/>
      <rect x="378" y="304" width="184" height="48" fill="url(#coin)"/>
      <ellipse cx="470" cy="304" rx="92" ry="24"/>
      <rect x="378" y="256" width="184" height="48" fill="url(#coin)"/>
      <ellipse cx="470" cy="256" rx="92" ry="24"/>
    </g>
    <g fill="url(#coin)" opacity=".95">
      <rect x="600" y="352" width="120" height="72" fill="url(#coin)"/>
      <ellipse cx="660" cy="352" rx="60" ry="16"/>
      <rect x="600" y="312" width="120" height="40" fill="url(#coin)"/>
      <ellipse cx="660" cy="312" rx="60" ry="16"/>
      <rect x="240" y="380" width="120" height="44" fill="url(#coin)"/>
      <ellipse cx="300" cy="380" rx="60" ry="16"/>
    </g>
  </g>
  <!-- plant -->
  <rect x="462" y="150" width="16" height="110" rx="8" fill="#15803d"/>
  <path d="M470 176c-46-10-62-46-52-76 44 2 62 32 52 76z" fill="url(#leaf)"/>
  <path d="M470 200c50-8 68-44 58-78-48 0-68 30-58 78z" fill="#22c55e"/>
  <path d="M470 128c-26-20-26-52-6-70 30 16 32 48 6 70z" fill="#4ade80"/>
</svg>
