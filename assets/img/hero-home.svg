<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-label="Entrepreneur at a laptop in a bright office">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#04361f"/><stop offset=".55" stop-color="#0b6b3f"/><stop offset="1" stop-color="#2fae6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#bbf7d0" stop-opacity=".55"/><stop offset="1" stop-color="#bbf7d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8d5524"/><stop offset="1" stop-color="#5c3512"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c4a1d"/><stop offset="1" stop-color="#42280f"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" fill="url(#hbg)"/>
  <ellipse cx="1300" cy="210" rx="420" ry="280" fill="url(#glow)"/>
  <g opacity=".18" fill="#ffffff">
    <rect x="60" y="70" width="180" height="10" rx="5"/><rect x="60" y="100" width="120" height="10" rx="5"/>
    <rect x="250" y="70" width="90" height="10" rx="5"/>
  </g>
  <!-- window blinds -->
  <g opacity=".14" fill="#ffffff">
    <rect x="1120" y="40" width="450" height="12" rx="6"/>
    <rect x="1120" y="76" width="450" height="12" rx="6"/>
    <rect x="1120" y="112" width="450" height="12" rx="6"/>
    <rect x="1120" y="148" width="450" height="12" rx="6"/>
  </g>
  <!-- plant -->
  <g transform="translate(950 250)">
    <rect x="-46" y="120" width="92" height="90" rx="12" fill="#f8fafc" opacity=".9"/>
    <g fill="#22c55e">
      <path d="M0 130c-52-6-70-46-58-78 48 4 66 38 58 78z"/>
      <path d="M0 130c54-6 72-46 60-78-50 4-68 38-60 78z"/>
      <path d="M0 120c-26-26-24-62-2-80 28 20 30 54 2 80z" fill="#4ade80"/>
    </g>
  </g>
  <!-- person -->
  <g transform="translate(1330 60)">
