    <path d="M-52 52c10-40 60-52 90-22 12 12 18 28 20 44-38-24-76-26-110-22z" fill="#1f2937"/>
    <g stroke="#0f172a" stroke-width="6" fill="none"><circle cx="-16" cy="72" r="17"/><circle cx="20" cy="72" r="17"/><path d="M2 70h2"/></g>
    <path d="M-12 100c12 12 26 12 38 0" stroke="#3f2a12" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-96 470V300c0-66 42-104 96-104s96 38 96 104v170z" fill="#f8fafc"/>
    <path d="M-42 226 0 300l42-74-42-30z" fill="#0b6b3f"/>
