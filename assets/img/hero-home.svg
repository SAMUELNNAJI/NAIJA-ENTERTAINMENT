  <g transform="translate(1000 0)">
    <rect x="0" y="150" width="330" height="210" rx="14" fill="#0f172a"/>
    <rect x="16" y="166" width="298" height="178" rx="8" fill="#f0fdf4"/>
    <g fill="#12a35d"><rect x="34" y="292" width="22" height="34" rx="4"/><rect x="64" y="272" width="22" height="54" rx="4"/><rect x="94" y="252" width="22" height="74" rx="4"/><rect x="124" y="232" width="22" height="94" rx="4"/></g>
    <g fill="#1d4ed8" opacity=".75"><rect x="176" y="206" width="18" height="120" rx="4"/><rect x="202" y="226" width="18" height="100" rx="4"/><rect x="228" y="246" width="18" height="80" rx="4"/><rect x="254" y="266" width="18" height="60" rx="4"/></g>
    <rect x="34" y="192" width="120" height="10" rx="5" fill="#0b6b3f" opacity=".6"/>
