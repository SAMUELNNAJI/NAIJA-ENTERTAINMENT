<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Notebook, savings jar and coffee on a study desk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f5ee"/><stop offset=".5" stop-color="#cfe8d9"/><stop offset="1" stop-color="#8fbfa4"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".9"/><stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="660" cy="100" r="130" fill="#ffffff" opacity=".35"/>
  <rect y="368" width="800" height="132" fill="#b98b57" opacity=".45"/>
  <rect y="368" width="800" height="10" fill="#ffffff" opacity=".3"/>
  <!-- notebook -->
  <g transform="rotate(-6 260 280)">
    <rect x="120" y="190" width="280" height="180" rx="10" fill="#1f2937"/>
    <rect x="134" y="204" width="252" height="152" rx="6" fill="#f8fafc"/>
    <g stroke="#94a3b8" stroke-width="5" stroke-linecap="round" opacity=".8">
      <path d="M160 236h200M160 266h200M160 296h150M160 326h180"/>
    </g>
    <text x="150" y="230" font-family="Segoe UI, Arial" font-size="26" font-weight="700" fill="#0b6b3f">PLAN</text>
  </g>
  <!-- pen -->
  <g transform="rotate(24 470 300)"><rect x="462" y="200" width="16" height="180" rx="8" fill="#1d4ed8"/><path d="M470 380l-11 26h22z" fill="#0f172a"/></g>
  <!-- jar -->
  <rect x="546" y="220" width="130" height="170" rx="18" fill="url(#glass)" stroke="#ffffff" stroke-width="4" opacity=".9"/>
  <rect x="538" y="200" width="146" height="26" rx="10" fill="#0e8a4f"/>
  <g fill="#22c55e"><circle cx="576" cy="330" r="15"/><circle cx="616" cy="348" r="13"/><circle cx="650" cy="322" r="12"/><circle cx="596" cy="300" r="11"/></g>
  <!-- cup -->
  <rect x="72" y="330" width="80" height="76" rx="10" fill="#ffffff" opacity=".95"/>
  <path d="M152 346h18a17 17 0 0 1 0 34h-18z" fill="none" stroke="#ffffff" stroke-width="8"/>
</svg>
