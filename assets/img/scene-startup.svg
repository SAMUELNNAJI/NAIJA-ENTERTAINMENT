      <stop offset="0" stop-color="#7a1c0a"/><stop offset=".45" stop-color="#ea580c"/><stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%">
      <stop offset="0" stop-color="#fff7ed"/><stop offset=".55" stop-color="#fcd34d"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
