# Render Blueprint — deploys The Nigerian Entrepreneur as a Python web
# service + managed Postgres. In Render: New → Blueprint → pick this repo.
databases:
  - name: naija-db
    plan: free

services:
  - type: web
    name: naija-entertainment
    runtime: python
    plan: free
    # Install → collectstatic (WhiteNoise serves the result) → migrate →
    # seed an empty DB and create the env-configured superuser.
    buildCommand: >-
      pip install -r requirements.txt
      && python manage.py collectstatic --noinput
      && python manage.py migrate
      && python manage.py bootstrap_site
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /
    envVars:
      # Pinned to the version this project is tested against — bump the
      # patch number if Render lists a newer 3.14.x.
      - key: PYTHON_VERSION
        value: 3.14.5
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: naija-db
          property: connectionString
      # Optional admin override (created/refreshed on each deploy when set —
      # fill these in the Render dashboard; seeded fallback: admin
      # / naija-admin-2025):
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
