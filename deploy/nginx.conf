# /etc/nginx/sites-available/thenigeriaentrepreneur.com
# Symlink this into /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name thenigeriaentrepreneur.com www.thenigeriaentrepreneur.com;

    # Redirect www -> non-www (optional; remove if you prefer www)
    if ($host = www.thenigeriaentrepreneur.com) {
        return 301 https://thenigeriaentrepreneur.com$request_uri;
    }

    location /static/ {
        alias /opt/naija/staticfiles/;
    }

    location /media/ {
        alias /opt/naija/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
